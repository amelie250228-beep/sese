<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🚽 공포 똥피하기</title>

<style>

body {
    margin: 0;
    overflow: hidden;
    font-family: sans-serif;
    background: radial-gradient(circle, #3a0000, #000);
    color: white;
    text-align: center;
    touch-action: none;
}

h1 {
    margin: 10px;
    font-size: 20px;
    color: #ff4444;
    text-shadow: 0 0 10px red;
}

#game {
    width: 100vw;
    height: 80vh;
    position: relative;
    overflow: hidden;
    border-top: 3px solid red;
    border-bottom: 3px solid red;
}

#player {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 50px;
}

.poop {
    position: absolute;
    font-size: 30px;
}

#startScreen {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    font-size: 18px;
    z-index: 10;
}

#score {
    font-size: 18px;
    margin-top: 10px;
    color: #ff7777;
}

</style>
</head>

<body>

<h1>🚽 공포 똥 피하기 🚽</h1>

<div id="game">

    <div id="player">🚽</div>

    <div id="startScreen">
        <div>화면 터치해서 시작</div>
        <div style="font-size:12px; margin-top:10px;">
            손가락으로 변기를 움직여라…
        </div>
    </div>

</div>

<div id="score">점수: 0</div>

<script>

const game = document.getElementById("game");
const player = document.getElementById("player");
const startScreen = document.getElementById("startScreen");
const scoreText = document.getElementById("score");

let gameStarted = false;
let gameOver = false;
let score = 0;

let playerX = window.innerWidth / 2;

let poops = [];

// 시작 (클릭 or 터치)
startScreen.addEventListener("click", startGame);
startScreen.addEventListener("touchstart", startGame);

function startGame() {
    startScreen.style.display = "none";
    gameStarted = true;
    spawnLoop();
}

// 손가락 이동
game.addEventListener("touchmove", (e) => {
    if (!gameStarted || gameOver) return;

    let touch = e.touches[0];
    playerX = touch.clientX;

    player.style.left = playerX + "px";
});

// 똥 생성
function createPoop() {

    const poop = document.createElement("div");
    poop.classList.add("poop");
    poop.innerText = "💩";

    let x = Math.random() * window.innerWidth;
    let y = -30;
    let speed = 2 + Math.random() * 4 + score * 0.1;

    poop.style.left = x + "px";
    poop.style.top = y + "px";

    game.appendChild(poop);

    function fall() {

        if (gameOver) return;

        y += speed;
        poop.style.top = y + "px";

        // 충돌
        if (
            y > window.innerHeight - 120 &&
            x > playerX - 30 &&
            x < playerX + 30
        ) {
            gameOver = true;
            alert("☠️ 게임 오버\n점수: " + score);
            location.reload();
        }

        // 통과
        if (y > window.innerHeight) {
            poop.remove();
            score++;
            scoreText.innerText = "점수: " + score;
            return;
        }

        requestAnimationFrame(fall);
    }

    fall();
}

// 계속 생성
function spawnLoop() {
    if (!gameStarted || gameOver) return;

    createPoop();
    setTimeout(spawnLoop, 700);
}

</script>

</body>
</html>
